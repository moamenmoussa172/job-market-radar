version: 2

models:
  - name: fct_job_postings
    description: One row per distinct tech job, deduplicated across sources.
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: job_title
        data_tests: [not_null]
      - name: track
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Data & Analytics', 'AI & Machine Learning', 'Software Engineering', 'Mobile Development', 'QA & Testing',
                         'UI/UX Design', 'DevOps & Cloud', 'Security', 'ERP & CRM', 'Networks & Telecom',
                         'Product & Delivery', 'IT & Support', 'Embedded & Chip Design']
      - name: industry
        data_tests: [not_null]
      - name: role_family
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('role_tracks')
                field: role_family
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: ['Intern / Student', 'Junior', 'Mid', 'Senior', 'Lead / Principal',
                         'Head / Director', 'Not stated']
      - name: work_mode
        data_tests:
          - accepted_values:
              arguments:
                values: ['Remote', 'Hybrid', 'Onsite']
      - name: remote_scope
        data_tests:
          - accepted_values:
              arguments:
                values: ['Worldwide', 'Restricted', 'Unknown']

  - name: dim_skills
    columns:
      - name: skill_id
        data_tests: [unique, not_null]

  - name: bridge_job_skills
    description: Skills each job mentions (title + description), one row per job x skill.
    columns:
      - name: job_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_job_postings')
                field: job_id
      - name: skill_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_skills')
                field: skill_id

  - name: bridge_job_regions
    description: Office location (onsite/hybrid) or remote eligibility, one row per job x country/region.
    columns:
      - name: job_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_job_postings')
                field: job_id
      - name: region
        data_tests: [not_null]

  - name: mart_weekly_new_jobs
    description: >
      Hiring trend: new tech jobs per week by scope ('All', 'Remote' or a country) and track.
      Backlog (jobs already open the first day a source or company board was read) is excluded.
    columns:
      - name: week_start
        data_tests: [not_null]
      - name: scope
        data_tests: [not_null]
      - name: new_jobs
        data_tests: [not_null]

  - name: mart_skill_trends
    description: >
      Skill momentum per scope: share of open jobs asking for a skill today vs window_days ago
      (change_pts = percentage-point change). Only scopes with 30+ open jobs in both periods.
    columns:
      - name: scope
        data_tests: [not_null]
      - name: skill
        data_tests: [not_null]

  - name: mart_time_to_close
    description: >
      Median / quartile days a job stays open, by role, from closed jobs on sources read daily.
      Roles with fewer than 5 closed jobs are left out.
    columns:
      - name: role_family
        data_tests: [not_null]
      - name: median_days_open
        data_tests: [not_null]
