name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest -q

  dbt-parse:
    runs-on: ubuntu-latest
    env:
      # dbt parse validates the project (SQL/Jinja, refs, YAML, tests) without a database.
      WAREHOUSE_DB_USER: ci
      WAREHOUSE_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r airflow/requirements-dbt.txt
      - run: dbt parse --project-dir dbt --profiles-dir dbt

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
