<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radarak weekly report: tech hiring this week</title>
  <meta name="description" content="This week in tech hiring for Egypt, the Gulf, Europe and remote: new jobs, hiring by track, skills on the rise and who is hiring. Download the card and share it.">
  <meta name="theme-color" content="#5B3FE0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Radarak weekly report: tech hiring this week">
  <meta property="og:image" content="https://moamenmoussa172.github.io/job-market-radar/og.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235B3FE0'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-opacity='.55' stroke-width='2'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23FFB020'/%3E%3Ccircle cx='10' cy='19' r='2.4' fill='%23FF5E3A'/%3E%3Ccircle cx='19' cy='22' r='2' fill='%2310B981'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="report-page">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="./" aria-label="Radarak">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle class="disc" cx="16" cy="16" r="15"/><circle class="ring" cx="16" cy="16" r="8.5"/>
          <circle cx="22.5" cy="9.5" r="3" fill="#FFB020"/><circle cx="9.5" cy="19.5" r="2.5" fill="#FF5C39"/><circle cx="19.5" cy="22.5" r="2.1" fill="#12B886"/></svg>
        <span id="brandName">Radarak</span>
      </a>
      <nav class="topnav"><a class="navlink" href="./" id="backLink">← Find jobs</a></nav>
    </div>
  </header>
  <main class="report">
    <section class="reportintro">
      <h1 id="rTitle">This week's tech hiring report</h1>
      <p class="hint" id="rHint">A shareable summary of the past week. Pick a place and language, then download the image and copy the post.</p>
      <div class="rcontrols">
        <label><span id="placeLabel">Place</span><select id="place"></select></label>
        <div class="seg2" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
        </div>
      </div>
    </section>
    <div class="rgrid">
      <div class="cardwrap"><canvas id="card" width="1080" height="1350" role="img" aria-label="Weekly report card"></canvas></div>
      <div class="rside">
        <button id="download" class="cvbtn" type="button">Download image</button>
        <label class="posttext"><span id="postLabel">Post text</span><textarea id="post" rows="12"></textarea></label>
        <button id="copy" class="sharebtn" type="button">Copy text</button>
        <p class="hint" id="rStatus" role="status"></p>
      </div>
    </div>
  </main>
  <script src="report.js" defer></script>
</body>
</html>
