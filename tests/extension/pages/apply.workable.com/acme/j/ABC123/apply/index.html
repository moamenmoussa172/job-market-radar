<!doctype html><html><head><meta charset="utf-8"><title>Backend Developer - Acme</title></head>
<body>
<h1 data-ui="job-title">Backend Developer</h1>
<form data-ui="application-form" onsubmit="return false">
  <label>First name<input name="firstname" data-ui="firstname"></label>
  <label>Last name<input name="lastname" data-ui="lastname"></label>
  <label>Email<input name="email" type="email"></label>
  <label>Headline<input name="headline"></label>
  <label>Phone<input name="phone" type="tel"></label>
  <label>Country<select name="country"><option value="">Select</option><option value="EG">Egypt</option><option value="SA">Saudi Arabia</option><option value="AE">United Arab Emirates</option></select></label>
  <label>City<input name="city"></label>
  <label>Resume<input type="file" name="resume" accept=".pdf,.doc,.docx,.txt"></label>
  <label>Cover letter<textarea name="cover_letter"></textarea></label>
  <label>Expected salary (monthly)<input name="QA_salary"></label>
  <label>Notice period<input name="QA_notice"></label>
  <label>Password<input type="password" name="pw"></label>
  <button type="submit">Submit application</button>
</form>
</body></html>
